services:
  whatsapp-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./store:/app/whatsapp-bridge/store
    # Pass the whole .env through, so optional bridge settings (ANTIBAN_*, PRESENCE_*,
    # WHATSAPP_ALLOWLIST_JIDS, CORS_ORIGINS, ...) reach the container. Needs Compose >= 2.24.
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=UTC
      - API_KEY=${API_KEY:?API_KEY is required - see .env.example}
      - DISABLE_AUTH_CHECK=${DISABLE_AUTH_CHECK:-false}
      - API_BIND_HOST=0.0.0.0  # Docker: accept from internal network; external port is already bound to 127.0.0.1:8180
      # Web UI login — server-side sessions, HttpOnly cookie
      - WEB_UI_USERNAME=${WEB_UI_USERNAME:?WEB_UI_USERNAME is required - see .env.example}
      - WEB_UI_PASSWORD=${WEB_UI_PASSWORD:?WEB_UI_PASSWORD is required - see .env.example}
      - WEB_UI_SESSION_TTL=${WEB_UI_SESSION_TTL:-24h}
      # History sync — only takes effect at QR pairing time, see docs/history-sync.md
      - HISTORY_SYNC_DAYS_LIMIT=${HISTORY_SYNC_DAYS_LIMIT:-365}
      - HISTORY_SYNC_SIZE_MB=${HISTORY_SYNC_SIZE_MB:-5000}
      - STORAGE_QUOTA_MB=${STORAGE_QUOTA_MB:-10240}
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - whatsapp_internal

  whatsapp-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    deploy:
      resources:
        limits:
          memory: 1536M  # loads the local embedding model on the first semantic search
          cpus: '1'
    ports:
      - "127.0.0.1:8081:8081"  # MCP server (localhost only)
    volumes:
      - ./store:/app/store
      # The search index. Mounted writable only because SQLite needs to touch the WAL side files to read it;
      # the server opens index.db read-only.
      - index-data:/app/index
      - model-cache:/app/models
    environment:
      - INDEX_DB_PATH=/app/index/index.db
      - EMBEDDING_CACHE_DIR=/app/models
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-fastembed}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - SEARCH_K_FTS=${SEARCH_K_FTS:-50}
      - SEARCH_K_VEC=${SEARCH_K_VEC:-50}
      - SEARCH_MIN_SIMILARITY=${SEARCH_MIN_SIMILARITY:-0}
      - DISPLAY_TZ=${DISPLAY_TZ:-America/Bahia}
      - TZ=UTC
      - DEBUG=true
      - MCP_TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8081
      - WHATSAPP_MCP_TOOLSETS=${WHATSAPP_MCP_TOOLSETS:-all}
      - BRIDGE_HOST=whatsapp-bridge
      - API_KEY=${API_KEY}
      # OAuth 2.1 for the MCP endpoint. Off unless MCP_PUBLIC_URL is set, see docs/mcp-oauth.md.
      # When on, the login page checks the same credentials as the web panel.
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-}
      - WEB_UI_USERNAME=${WEB_UI_USERNAME:-}
      - WEB_UI_PASSWORD=${WEB_UI_PASSWORD:-}
      - MCP_OAUTH_ACCESS_TOKEN_TTL=${MCP_OAUTH_ACCESS_TOKEN_TTL:-3600}
      - MCP_OAUTH_REFRESH_TOKEN_TTL=${MCP_OAUTH_REFRESH_TOKEN_TTL:-2592000}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8081), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      whatsapp-bridge:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - whatsapp_internal

  web-ui:
    build:
      context: .
      dockerfile: Dockerfile.web-ui
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      whatsapp-bridge:
        condition: service_started  # not service_healthy: web-ui must start to show QR when bridge needs pairing
    restart: unless-stopped
    networks:
      - whatsapp_internal

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    deploy:
      resources:
        limits:
          memory: 2G  # ONNX embedding model plus a batch of chunks
          cpus: '2'
    working_dir: /app/whatsapp-mcp-server
    entrypoint: ["python", "-m", "search.indexer"]
    volumes:
      - ./store:/app/store:ro          # messages.db / whatsapp.db, read-only: the indexer never writes to the bridge store
      - index-data:/app/index          # index.db lives in its own writable volume instead
      - model-cache:/app/models        # embedding model, downloaded once on first start
    environment:
      - TZ=UTC
      - INDEX_DB_PATH=/app/index/index.db
      - EMBEDDING_CACHE_DIR=/app/models
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-fastembed}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-32}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - INDEX_POLL_SECONDS=${INDEX_POLL_SECONDS:-20}
      - CHUNK_GAP_MINUTES=${CHUNK_GAP_MINUTES:-30}
      - CHUNK_MAX_MESSAGES=${CHUNK_MAX_MESSAGES:-15}
      - CHUNK_MAX_CHARS=${CHUNK_MAX_CHARS:-1500}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-2}
    depends_on:
      whatsapp-bridge:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - whatsapp_internal

networks:
  whatsapp_internal:
    driver: bridge

volumes:
  # Named volume, not a bind mount: Docker would create a missing ./store-index as root and the non-root
  # container user could not write index.db. A named volume inherits the ownership of /app/index in the image.
  index-data:
  model-cache:  # local embedding model (~0.5 GB), shared by the indexer and the MCP server

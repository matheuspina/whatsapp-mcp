name: ✨ Feature Request
description: Propose a new WhatsApp transport feature or MCP tool
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        ### 📐 Design Philosophy Reminder
        WhatsApp MCP focuses strictly on **Lean Transport Primitives** for WhatsApp (socket lifecycle, messaging CRUD, media downloads, reactions, group management, presence, webhooks, and safety allowlists). Heavy processing (transcription, embeddings, summarization) is better built as a separate service or MCP server.
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What transport primitive or MCP tool would you like added?
      placeholder: Describe the proposal...
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Rationale
      description: How does this help AI agents interact with WhatsApp?
    validations:
      required: true

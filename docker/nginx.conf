# nginx for the single-image deployment. Runs as an unprivileged user, so every writable path is under /tmp.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Behind a TLS-terminating proxy (Coolify) the scheme arrives in X-Forwarded-Proto. The bridge uses it
    # to mark the session cookie Secure, so keep the incoming value and only fall back to our own scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Set here because a location that sets any proxy_set_header drops all the inherited ones.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    upstream whatsapp_bridge {
        server 127.0.0.1:8180;
        keepalive 8;
    }

    upstream whatsapp_mcp {
        server 127.0.0.1:8081;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /api/ {
            client_max_body_size 64m;
            proxy_pass http://whatsapp_bridge;
        }

        # MCP endpoint and OAuth routes, or 404s for them when MCP_PUBLIC_URL is not set (see entrypoint.sh).
        include /etc/nginx/mcp-active.conf;

        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

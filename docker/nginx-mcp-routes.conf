# Routes to the MCP server, included only when MCP_PUBLIC_URL is set. Exact and anchored matches so the
# panel's own pages (for example /mcp-clients/) are never captured.
location ~ ^/(mcp|register|authorize|token|revoke|oauth/login)$ {
    proxy_pass http://whatsapp_mcp;
    # Streamable HTTP keeps responses open: do not buffer them.
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location ^~ /.well-known/ {
    proxy_pass http://whatsapp_mcp;
}
